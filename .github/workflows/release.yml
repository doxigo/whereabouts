name: Release

# Push a version tag to build, self-test and publish a release:
#   git tag v1.1.0 && git push origin v1.1.0
# Or rebuild an existing tag's release from the Actions tab (Run workflow).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild, e.g. v1.0.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Stamp the version from the tag
        run: |
          plutil -replace CFBundleShortVersionString -string "${TAG#v}" Resources/Info.plist
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" Resources/Info.plist

      # No signing identity on the runner, so build.sh signs ad hoc.
      - run: ./build.sh

      - name: Self-test
        run: build/Whereabouts.app/Contents/MacOS/Whereabouts --selftest

      # A disk image is how a Mac app ships as one file: it opens to the app
      # beside an Applications shortcut to drag it onto.
      - name: Package
        run: |
          mkdir dmg
          ditto build/Whereabouts.app dmg/Whereabouts.app
          ln -s /Applications dmg/Applications
          # ponytail: hdiutil on hosted runners sometimes fails with "Resource busy"; a retry clears it.
          for attempt in 1 2 3; do
            hdiutil create -volname Whereabouts -srcfolder dmg -format UDZO "Whereabouts-${TAG#v}.dmg" && break
            sleep 5
          done
          test -f "Whereabouts-${TAG#v}.dmg"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Whereabouts-${TAG#v}.dmg" --clobber
            exit 0
          fi
          gh release create "$TAG" "Whereabouts-${TAG#v}.dmg" \
            --title "Whereabouts ${TAG#v}" --generate-notes --notes "$(cat <<'EOF'
          For Apple silicon Macs on macOS 14 or later. Open the disk image and drag **Whereabouts** to Applications.

          The app is signed ad hoc, not notarized, so macOS blocks the first launch. Open it once, then go to **System Settings › Privacy & Security** and click **Open Anyway**. Or run:

          ```bash
          xattr -dr com.apple.quarantine /Applications/Whereabouts.app
          ```
          EOF
          )"
